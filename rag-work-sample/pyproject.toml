[project]
name = "support-assistant-work-sample"
version = "0.1.0"
description = "A local-only, evaluated support-policy assistant work sample. Not production software."
requires-python = ">=3.12"
dependencies = [
    # The only runtime dependency. Already present in the environment this was
    # built in; nothing else is needed and nothing else is installed.
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
# anyio is required, not optional-in-practice: 15 tests are `async def` marked
# with @pytest.mark.anyio and conftest.py supplies an anyio_backend fixture.
# Without the plugin pytest skips them with "async def functions are not natively
# supported", which reads like a skip and is actually a failure.
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
